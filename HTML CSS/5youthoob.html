<!DOCTYPE html>
<html>
    <head>
        <title>Youtube.com</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

        <style>
            p {
                margin-top:0px;
                margin-bottom:0px;
            }
            .thumbnail {
                width: 300px;
                display: block;
            }

            .searchbar {
                margin-left: 20px;
                display: block;
                margin-bottom: 20px;
            }

            .title {
                width: 230px;
                margin-top: 0px;
                margin-bottom: 10px;
                line-height: 20px;
                font-size : 14px;
                font-weight : 550;
                line-height : 20px;
                background-color : red;
            }

            .owner {
                display: inline-block;
                vertical-align: top;
                font-size: 12px;
                color : gray;
                margin-bottom : 3px;

            }

            .views {
                margin-top: 5px;
                font-size: 12px;
                color : gray;
            }

            .videopreview {
                display: inline-block;
                margin-right: 30px;
                vertical-align: top;
                font-family: 'Roboto', sans-serif;
            }

            .a {
                display: inline-block;
                width: 40px;
                
                object-fit: cover;
                vertical-align : top;
                border-radius : 50px ;
                background-color : red;
            }

            .videoinfo {
                display: inline-block;
                width: 200px;
                vertical-align: top;
            }
            .thumbnail-row {
                margin-bottom: 10px;
            }
        </style>
    </head>

    <body>

        <input class="searchbar" type="text" placeholder="Search">

        <div class="videopreview">

                alt="Blank">

            </div>

            </div>

        </div>
